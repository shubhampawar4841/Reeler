name: Generate Reel

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Optional story text. Leave empty to auto-fetch a YouTube transcript."
        required: false
        type: string

      youtube_url:
        description: "Optional YouTube URL/ID to pull transcript from (manual testing)."
        required: false
        type: string

      lang:
        description: "Language"
        required: false
        default: "en"
        type: choice
        options:
          - en
          - hi

      privacy:
        description: "YouTube privacy status"
        required: false
        default: "public"
        type: choice
        options:
          - private
          - unlisted
          - public

      gender:
        description: "Voice gender"
        required: false
        default: "female"
        type: choice
        options:
          - female
          - male

  # Daily slots. Cron is UTC; IST times are shown below.
  # GitHub may delay scheduled workflows by several minutes.
  schedule:
    - cron: "47 0 * * *"  # 06:17 IST
    - cron: "13 4 * * *"  # 09:43 IST
    - cron: "41 8 * * *"  # 14:11 IST
    - cron: "43 9 * * *"  # 15:13 IST
    - cron: "48 9 * * *"  # 15:18 IST
    - cron: "53 9 * * *"  # 15:23 IST
    - cron: "58 9 * * *"  # 15:28 IST
    - cron: "7 13 * * *"  # 18:37 IST
    - cron: "23 17 * * *" # 22:53 IST

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    # Video generation can take several minutes.
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # --------------------------------------------------
      # 3. Install FFmpeg
      # --------------------------------------------------
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Full apt build (complete TLS/protocol support) instead of ffmpeg-static.
          echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          ffmpeg -version | head -n 1
      # --------------------------------------------------
      # 4. Install project dependencies
      #
      # npm install is being used temporarily because
      # npm ci was failing due to the lockfile mismatch.
      # --------------------------------------------------
      - name: Install npm dependencies
        run: npm install

      # --------------------------------------------------
      # 5. Get story
      #
      # Manual:
      #   story provided -> use it
      #
      # Automatic cron:
      #   no story -> search YouTube + get transcript
      # --------------------------------------------------
      - name: Resolve story text
        id: story
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Only use form inputs on manual runs (cron has no inputs)
          STORY_TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.story || '' }}
          YT_VIDEO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.youtube_url || '' }}
          LANG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.lang || 'en' }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |
          set -euo pipefail
          mkdir -p /tmp/reeler
          echo "Event: $EVENT_NAME"
          # Cron / schedule → always auto YouTube transcript (ignore empty inputs)
          if [ "$EVENT_NAME" = "schedule" ] || [ -z "${STORY_TEXT:-}" ]; then
            echo "Auto mode: random configured channel → transcript → story input"
            if [ "$EVENT_NAME" != "schedule" ] && [ -n "${YT_VIDEO_URL:-}" ]; then
              echo "Using manually supplied YouTube URL."
              npx tsx scripts/fetch-youtube-story.ts \
                --youtube-url "$YT_VIDEO_URL" \
                --lang "$LANG_INPUT" \
                --out /tmp/reeler/story.txt \
                --meta /tmp/reeler/meta.json
            else
              echo "Discovering a YouTube video with captions..."
              npx tsx scripts/fetch-youtube-story.ts \
                --lang "$LANG_INPUT" \
                --out /tmp/reeler/story.txt \
                --meta /tmp/reeler/meta.json
            fi
            echo "source=youtube_transcript" >> "$GITHUB_OUTPUT"
            echo "----------- SOURCE METADATA -----------"
            cat /tmp/reeler/meta.json
            echo "---------------------------------------"
            wc -c /tmp/reeler/story.txt
          else
            echo "Using manually supplied story."
            printf '%s' "$STORY_TEXT" > /tmp/reeler/story.txt
            echo "source=manual" >> "$GITHUB_OUTPUT"
            echo "Story length: ${#STORY_TEXT} characters"
          fi
      # --------------------------------------------------
      # 6. Generate video + upload to YouTube
      # --------------------------------------------------
      - name: Generate reel and upload to YouTube
        env:
          # Use the lightweight GitHub Actions configuration.
          STORY_RENDERER: ffmpeg
          TTS_ENGINE: edge

          # AI
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # YouTube OAuth
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          # Workflow inputs
          LANG_INPUT: ${{ inputs.lang || 'en' }}
          PRIVACY_INPUT: ${{ inputs.privacy || 'private' }}
          GENDER_INPUT: ${{ inputs.gender || 'female' }}

        run: |
          set -euo pipefail
          echo "Reading generated story..."
          STORY_TEXT="$(cat /tmp/reeler/story.txt)"
          if [ -z "$STORY_TEXT" ]; then
            echo "ERROR: Story text is empty."
            exit 1
          fi
          echo "Story length: ${#STORY_TEXT} characters"
          echo "Starting Reel generation..."
          npx tsx scripts/generate-and-upload-reel.ts \
            --story "$STORY_TEXT" \
            --lang "$LANG_INPUT" \
            --privacy "$PRIVACY_INPUT" \
            --gender "$GENDER_INPUT"
          echo "Reel generation/upload completed successfully."