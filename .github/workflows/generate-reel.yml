name: Generate Reel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - transcript_only

      story:
        description: "Optional story text. Leave empty to auto-fetch a YouTube transcript."
        required: false
        type: string

      youtube_url:
        description: "Optional YouTube URL/ID to pull transcript from (manual testing)."
        required: false
        type: string

      force_random:
        description: "Ignore story/youtube_url and force a random channel transcript fetch."
        required: false
        default: false
        type: boolean

      lang:
        description: "Language"
        required: false
        default: "en"
        type: choice
        options:
          - en
          - hi

      privacy:
        description: "YouTube privacy status"
        required: false
        default: "public"
        type: choice
        options:
          - private
          - unlisted
          - public

      gender:
        description: "Voice gender"
        required: false
        default: "female"
        type: choice
        options:
          - female
          - male

  # Daily slots. Cron is UTC; IST times are shown below.
  # GitHub may delay scheduled workflows by several minutes.
  schedule:
    - cron: "47 0 * * *"  # 06:17 IST
    - cron: "13 4 * * *"  # 09:43 IST
    - cron: "41 8 * * *"  # 14:11 IST
    - cron: "43 9 * * *"  # 15:13 IST
    - cron: "48 9 * * *"  # 15:18 IST
    - cron: "53 9 * * *"  # 15:23 IST
    - cron: "58 9 * * *"  # 15:28 IST
    - cron: "7 13 * * *"  # 18:37 IST
    - cron: "23 17 * * *" # 22:53 IST

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    # Video generation can take several minutes.
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # --------------------------------------------------
      # 3. Install FFmpeg
      # --------------------------------------------------
      - name: Install FFmpeg + yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Full apt build (complete TLS/protocol support) instead of ffmpeg-static.
          echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          ffmpeg -version | head -n 1
          # youtube-transcript is IP-blocked on GitHub runners; yt-dlp fetches captions reliably.
          python3 -m pip install --user -U yt-dlp
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          yt-dlp --version
          # Force CI transcript path to prefer yt-dlp.
          echo "YT_TRANSCRIPT_ENGINE=ytdlp" >> "$GITHUB_ENV"
      # --------------------------------------------------
      # 4. Install project dependencies
      #
      # npm install is being used temporarily because
      # npm ci was failing due to the lockfile mismatch.
      # --------------------------------------------------
      - name: Install npm dependencies
        run: npm install

      # --------------------------------------------------
      # 5. Get story
      #
      # Manual:
      #   story provided -> use it
      #
      # Automatic cron:
      #   no story -> search YouTube + get transcript
      # --------------------------------------------------
      - name: Resolve story text
        id: story
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
          FORCE_RANDOM: ${{ github.event_name == 'workflow_dispatch' && inputs.force_random || false }}
          # Only use form inputs on manual runs (cron has no inputs)
          STORY_TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.story || '' }}
          YT_VIDEO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.youtube_url || '' }}
          LANG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.lang || 'en' }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Netscape cookies.txt contents — required on GitHub runners (bot check).
          YT_DLP_COOKIES: ${{ secrets.YT_DLP_COOKIES }}

        run: |
          set -euo pipefail
          mkdir -p /tmp/reeler
          echo "Event: $EVENT_NAME"
          echo "Mode: ${RUN_MODE:-full}"
          echo "Force random: ${FORCE_RANDOM:-false}"
          if [ -n "${YT_DLP_COOKIES:-}" ]; then
            printf '%s\n' "$YT_DLP_COOKIES" > /tmp/reeler/youtube-cookies.txt
            export YT_DLP_COOKIES_FILE=/tmp/reeler/youtube-cookies.txt
            echo "yt-dlp cookies: enabled"
          else
            echo "yt-dlp cookies: missing (set secret YT_DLP_COOKIES if CI gets bot-blocked)"
          fi

          # Cron, transcript-only, force_random, or empty story → fetch from YouTube.
          if [ "$EVENT_NAME" = "schedule" ] \
            || [ "${RUN_MODE:-full}" = "transcript_only" ] \
            || [ "${FORCE_RANDOM:-false}" = "true" ] \
            || [ -z "${STORY_TEXT:-}" ]; then

            if [ "$EVENT_NAME" != "schedule" ] \
              && [ "${FORCE_RANDOM:-false}" != "true" ] \
              && [ -n "${YT_VIDEO_URL:-}" ]; then
              echo "Using manually supplied YouTube URL."
              npx tsx scripts/fetch-youtube-story.ts \
                --youtube-url "$YT_VIDEO_URL" \
                --lang "$LANG_INPUT" \
                --out /tmp/reeler/story.txt \
                --meta /tmp/reeler/meta.json
            else
              echo "Discovering a random YouTube video with captions..."
              npx tsx scripts/fetch-youtube-story.ts \
                --lang "$LANG_INPUT" \
                --out /tmp/reeler/story.txt \
                --meta /tmp/reeler/meta.json
            fi
            echo "source=youtube_transcript" >> "$GITHUB_OUTPUT"
            echo "----------- SOURCE METADATA -----------"
            cat /tmp/reeler/meta.json
            echo "---------------------------------------"
            echo "----------- STORY PREVIEW (first 400 chars) -----------"
            head -c 400 /tmp/reeler/story.txt || true
            echo
            echo "-------------------------------------------------------"
            wc -c /tmp/reeler/story.txt
          else
            echo "Using manually supplied story."
            printf '%s' "$STORY_TEXT" > /tmp/reeler/story.txt
            echo "source=manual" >> "$GITHUB_OUTPUT"
            echo "Story length: ${#STORY_TEXT} characters"
          fi
          rm -f /tmp/reeler/youtube-cookies.txt
      # --------------------------------------------------
      # 6. Generate video + upload to YouTube
      # --------------------------------------------------
      - name: Generate reel and upload to YouTube
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'transcript_only' }}
        env:
          # Use the lightweight GitHub Actions configuration.
          STORY_RENDERER: ffmpeg
          TTS_ENGINE: edge

          # AI
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # YouTube OAuth
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          # Workflow inputs
          LANG_INPUT: ${{ inputs.lang || 'en' }}
          PRIVACY_INPUT: ${{ inputs.privacy || 'private' }}
          GENDER_INPUT: ${{ inputs.gender || 'female' }}

        run: |
          set -euo pipefail
          echo "Reading generated story..."
          STORY_TEXT="$(cat /tmp/reeler/story.txt)"
          if [ -z "$STORY_TEXT" ]; then
            echo "ERROR: Story text is empty."
            exit 1
          fi
          echo "Story length: ${#STORY_TEXT} characters"
          echo "Starting Reel generation..."
          npx tsx scripts/generate-and-upload-reel.ts \
            --story "$STORY_TEXT" \
            --lang "$LANG_INPUT" \
            --privacy "$PRIVACY_INPUT" \
            --gender "$GENDER_INPUT"
          echo "Reel generation/upload completed successfully."